<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="施設内で作成したWebアプリを共有し、アプリごとに意見や不具合を書き込むためのシステムです。">
  <meta name="theme-color" content="#2f6f68">
  <title>あぷりんく</title>

  <!-- パスはすべて相対指定。GitHub Pagesのサブフォルダ公開でもそのまま動く -->
  <!-- ブラウザのタブ用 -->
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">

  <!-- ホーム画面に追加したときのアイコン（iPhone / iPad） -->
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon-180.png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">

  <!-- ホーム画面に追加したときの設定 -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="application-name" content="あぷりんく">
  <meta name="apple-mobile-web-app-title" content="あぷりんく">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== ヘッダー ===== -->
  <header class="header">
    <button class="icon-button header__nav-toggle" id="navToggle" type="button" aria-label="アプリ一覧を開く" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

    <div class="header__brand">
      <span class="header__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="13" rx="2.5"/><path d="M9 20.5h6"/><path d="M8 9.5h8M8 13h5"/></svg>
      </span>
      <span class="header__title">あぷりんく</span>
      <span class="header__tag">試作版</span>
    </div>

    <div class="header__session" id="headerSession" hidden>
      <span class="header__session-text">ログイン中：<b id="sessionName"></b></span>
      <button class="button button--quiet header__logout" id="logoutButton" type="button">ログアウト</button>
    </div>

    <button class="button header__login" id="loginButton" type="button">
      <span class="button__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M10 4.5H5.5v15H10"/><path d="M14 8l4 4-4 4"/><path d="M18 12H9"/></svg>
      </span>
      <span class="header__login-label">ログイン</span>
    </button>

    <button class="button button--ghost header__settings" id="settingsButton" type="button">
      <span class="button__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 100-6.4 3.2 3.2 0 000 6.4z"/><path d="M19.5 12a7.5 7.5 0 00-.1-1.2l2-1.5-2-3.4-2.3 1a7.5 7.5 0 00-2-1.2L14.7 3H9.3l-.4 2.7a7.5 7.5 0 00-2 1.2l-2.3-1-2 3.4 2 1.5a7.5 7.5 0 000 2.4l-2 1.5 2 3.4 2.3-1a7.5 7.5 0 002 1.2l.4 2.7h5.4l.4-2.7a7.5 7.5 0 002-1.2l2.3 1 2-3.4-2-1.5c.07-.4.1-.8.1-1.2z"/></svg>
      </span>
      <span class="header__settings-label">設定</span>
    </button>
  </header>

  <!-- ===== 本体 ===== -->
  <div class="layout">

    <!-- 左：アプリ一覧 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__head">
        <span class="sidebar__head-label">アプリ一覧</span>
        <span class="sidebar__head-count" id="appCount"></span>
      </div>
      <nav class="sidebar__nav" id="appList" aria-label="アプリ一覧"></nav>
      <div class="sidebar__foot">
        <p class="sidebar__note">現在は試作版です。コメントはこの端末内にのみ保存されます。</p>
      </div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <!-- 右：アプリ情報＋コメント -->
    <main class="main" id="main">

      <!-- 未ログインのとき -->
      <div class="login-prompt" id="loginPrompt" hidden>
        <div class="login-prompt__box">
          <span class="login-prompt__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M6.5 10.5h11v9h-11z"/><path d="M9 10.5V8a3 3 0 016 0v2.5"/></svg>
          </span>
          <h2 class="login-prompt__title">ログインしてください</h2>
          <p class="login-prompt__text">職員としてログインすると、アプリ一覧とコメントが表示されます。</p>
          <button class="button" type="button" data-open-login>ログイン</button>
        </div>
      </div>

      <!-- アプリが1件も登録されていないとき -->
      <div class="login-prompt" id="emptyApps" hidden>
        <div class="login-prompt__box">
          <span class="login-prompt__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3.5 6.5h6l2 2.5h9v9.5h-17z"/><path d="M12 11.5v5M9.5 14h5"/></svg>
          </span>
          <h2 class="login-prompt__title">まだアプリが登録されていません</h2>
          <p class="login-prompt__text">設定からアプリを登録してください。登録すると左の一覧に並びます。</p>
          <button class="button" type="button" data-open-settings>設定を開く</button>
        </div>
      </div>

      <!-- アプリ名＋タブ（概要 / ファイル / チャット） -->
      <div class="workbar" id="workbar"></div>

      <div class="main__scroll" id="mainScroll">
        <section class="tabpanel" id="panelOverview" aria-live="polite">
          <div class="detail" id="appDetail"></div>
        </section>

        <section class="tabpanel" id="panelFiles" hidden>
          <div class="panel" id="appFiles"></div>
        </section>

        <section class="tabpanel" id="panelChat" hidden>
          <section class="comments" id="commentSection"></section>
        </section>
      </div>

      <div class="composer" id="composer" hidden></div>
    </main>

  </div>

  <!-- ===== 写真の拡大表示 ===== -->
  <div class="lightbox" id="imageLightbox" hidden></div>

  <!-- ===== ログイン ===== -->
  <div class="modal" id="loginModal" hidden>
    <div class="modal__scrim" data-close></div>
    <div class="modal__panel modal__panel--narrow" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <header class="modal__head">
        <h2 class="modal__title" id="loginTitle">職員ログイン</h2>
        <button class="icon-button modal__close" type="button" data-close aria-label="閉じる">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
        </button>
      </header>
      <div class="modal__body" id="loginBody"></div>
    </div>
  </div>

  <!-- ===== 設定 ===== -->
  <div class="modal" id="settingsModal" hidden>
    <div class="modal__scrim" data-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <header class="modal__head">
        <h2 class="modal__title" id="settingsTitle">設定</h2>
        <button class="icon-button modal__close" type="button" data-close aria-label="設定を閉じる">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
        </button>
      </header>
      <div class="modal__body" id="settingsBody"></div>
    </div>
  </div>

  <!-- ===== 通知 ===== -->
  <div class="toast-area" id="toastArea" role="status" aria-live="polite"></div>

  <!-- Supabase クライアント（バージョン固定 + 改ざん検知つき） -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1/dist/umd/supabase.js"
    integrity="sha384-K1nraABOP/zFehpLIUksXebbs7jMpB8gYMlb+uhVKZcWT/9Vkq1+qhv6ndC+1Yuz"
    crossorigin="anonymous"></script>

  <script src="data/apps.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
